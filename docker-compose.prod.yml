services:
  app:
    image: ${ECR_REGISTRY}/${REPO_NAME}:${IMAGE_TAG:-latest}
    container_name: deskflow-backend-prod
    labels:
      service: "deskflow-backend"
      environment: "production"
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /home/ubuntu/.deskflow-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
