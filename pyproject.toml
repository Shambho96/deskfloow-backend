[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-backend"
version = "0.1.0"
description = "DeskFlow Hotel PMS Backend API (FastAPI + Strawberry GraphQL + Async PostgreSQL)"
authors = [{ name = "DeskFlow Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "strawberry-graphql[fastapi]>=0.240.0",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E9",   # Syntax and runtime fatal errors
    "F63",  # Assert tests
    "F7",   # Undefined names in syntax
    "F82",  # Undefined names
    "F401", # Unused imports
    "F841", # Unused variables
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
]
ignore = [
    "E501", # Line length (managed by ruff formatter)
    "E402", # Module level import not at top of file
    "F401", # Ignore unused imports in __init__.py / re-exports
    "W291", # Trailing whitespace
    "W293", # Blank line contains whitespace
    "E712", # Comparison to True (standard in SQLAlchemy queries)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
